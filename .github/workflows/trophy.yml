name: Generate GitHub Profile Trophy

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gerar trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=milenorl&theme=tokyonight&column=7&margin-w=8&margin-h=8"
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git commit -m "chore: update trophy card" || exit 0
          git push
